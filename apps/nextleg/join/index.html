<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>NextLeg</title>
<link rel="icon" type="image/png" href="/images/nextleg/icon-64.png">
<link rel="apple-touch-icon" href="/images/nextleg/icon-180.png">
<link rel="stylesheet" href="/apps/style.css">
</head>
<body class="theme-nextleg">
<header class="site-header">
  <a class="brand" href="/apps/nextleg/#pl"><img src="/images/nextleg/icon-64.png" alt="" width="32" height="32">NextLeg</a>
  <nav><a href="en/" hreflang="en" lang="en">English</a></nav>
</header>
<main>
<h1>Masz zaproszenie do grupy w NextLeg</h1>
<div class="link-code" id="code" hidden></div>
<ol>
  <li>Zainstaluj NextLeg</li>
  <li>Otwórz ten link ponownie albo wpisz kod</li>
</ol>
<a class="link-btn" id="open" href="nextleg://join" hidden>Otwórz w NextLeg</a>
<a class="link-btn soon-btn" href="#" aria-disabled="true">Wkrótce w App Store</a>
<p class="muted">Kod nie działa? Poproś o nowe zaproszenie osobę z grupy.</p>
</main>
<script>
(function () {
  var code = new URLSearchParams(location.search).get("code");
  if (code && /^[A-Za-z0-9]{4,12}$/.test(code)) {
    var el = document.getElementById("code");
    el.textContent = code.toUpperCase();
    el.hidden = false;
    var open = document.getElementById("open");
    open.href = "nextleg://join?code=" + encodeURIComponent(code.toUpperCase());
    open.hidden = false;
  }
})();
</script>
</body>
</html>
